# ---- DEV: your local machine ----
server.port=8082

spring.datasource.url=jdbc:mariadb://localhost:3306/slotmind?createDatabaseIfNotExist=true&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=5

# Let Hibernate build/update the tables for you while you are learning
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.example.slotmind=DEBUG

# Load demo data after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed.sql

# Gemini key for the AI scheduling strategy: set the GEMINI_API_KEY environment variable
slotmind.ai.api-key=${GEMINI_API_KEY:}
