# ---- QA: shared test server ----
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mariadb://qa-db-host:3306/slotmind}
spring.datasource.username=${DB_USERNAME:qauser}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.hikari.maximum-pool-size=20

# Never let Hibernate change a shared schema - only check it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.example.slotmind=INFO

spring.sql.init.mode=never
