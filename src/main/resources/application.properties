# ---- Common settings (apply to every environment) ----
spring.application.name=slotmind

# Which environment to run. Override with:
#   --spring.profiles.active=qa   (command line)
#   SPRING_PROFILES_ACTIVE=qa     (environment variable)

spring.profiles.active=dev

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
server.port=8081

# Close the persistence context at the end of the service call, not the HTTP response.
spring.jpa.open-in-view=false

# Active scheduling strategy at startup. Switchable at runtime via PUT /api/scheduling/strategy.
# Registered strategies: rule
slotmind.scheduling.strategy=rule

# Background pool for the re-schedule loop (provider offline / slot cancelled)
slotmind.async.core-pool-size=2
slotmind.async.max-pool-size=4
slotmind.async.queue-capacity=500

# AI scheduling strategy (Gemini). The key comes from the environment, never from source.
#   export GEMINI_API_KEY=...   then switch with PUT /api/scheduling/strategy {"strategy":"ai"}
# Without a key the ai strategy falls back to the rule strategy.
slotmind.ai.api-key=${GEMINI_API_KEY:}
slotmind.ai.model=gemini-3.5-flash-lite
slotmind.ai.base-url=https://generativelanguage.googleapis.com
slotmind.ai.timeout-seconds=15
slotmind.ai.max-candidates=15
